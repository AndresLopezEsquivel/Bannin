# Runs the app and Postgres on this machine.
name: bannin

services:
  app:
    # Builds the app image from the Dockerfile in the repo root, next to this file.
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    # The image has no curl, so the check uses Python. urlopen raises an
    # error on a refused connection or a 4xx/5xx response, and the exit code is 1.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

  db:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Mounts the named volume db-data at /var/lib/postgresql in the container.
      # Whatever Postgres writes there goes into the volume, not into the
      # container's own filesystem. The volume survives when docker compose down
      # deletes the container.
      # Postgres 18 writes to /var/lib/postgresql/18/docker, inside this mount.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

volumes:
  db-data:
