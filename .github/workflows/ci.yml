name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow only checks the code.
permissions:
  contents: read

# One run per branch or PR at a time. A new push to a PR cancels its
# older run; runs on main always finish, so every commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned to a full commit SHA, with the tag as a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # the job never pushes, so drop the token
      # Installs uv, which runs the validator below.
      # Action: https://github.com/astral-sh/setup-uv
      # Guide: https://docs.astral.sh/uv/guides/integration/github/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
      - name: Validate the OpenAPI spec
        run: uvx openapi-spec-validator==0.9.0 api/openapi.yaml
      - name: Check the examples against their schemas
        run: uv run --script scripts/check_examples.py

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
      # Installs Python (from .python-version) and the exact versions in
      # uv.lock, dev tools included. Fails if uv.lock is out of date.
      - name: Install dependencies from uv.lock
        run: uv sync --locked
      - name: Lint with ruff
        run: uv run ruff check
      - name: Check formatting with ruff
        run: uv run ruff format --check
      - name: Run the tests with pytest
        run: uv run pytest

  # Checks the Terraform code without AWS credentials: nothing here reads
  # or changes real infrastructure.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Action: https://github.com/hashicorp/setup-terraform
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false  # plain terraform output and exit codes
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      # Downloads the providers in the lock file, without a backend.
      # Fails if the lock file is missing or would need to change.
      - name: Initialize the costs stack
        run: terraform -chdir=infra/costs init -backend=false -input=false -lockfile=readonly
      - name: Validate the costs stack
        run: terraform -chdir=infra/costs validate
      - name: Initialize the app stack
        run: terraform -chdir=infra/app init -backend=false -input=false -lockfile=readonly
      - name: Validate the app stack
        run: terraform -chdir=infra/app validate

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
      # The same pinned ShellCheck as on a developer's machine.
      - name: Lint the shell scripts with ShellCheck
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck scripts/*.sh

  # Builds the image and starts the app and Postgres with compose.yaml,
  # as on a developer's machine. Docker and Compose come with the runner.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A new random password for each run. The value is never printed.
      - name: Write a random Postgres password to .env
        run: printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
      # Returns once both health checks (app's and db's) pass; fails if they don't within 60s.
      - name: Build and start the containers
        run: docker compose up --build --wait --wait-timeout 60
      # Calls /health from the runner (not inside a container), through the published port.
      - name: Call /health
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health
      # Fails if the app runs as root.
      - name: Check the app doesn't run as root
        run: |
          uid=$(docker compose exec -T app id -u)
          echo "app UID: $uid"
          test "$uid" != 0
      - name: Show the container logs
        if: failure()
        run: docker compose logs
      - name: Stop and delete the containers and the volume
        if: always()
        run: docker compose down -v

  # Builds the arm64 image that the AWS instance runs, and checks it. On a
  # push to main, also publishes it to GitHub's container registry.
  image:
    needs: [api-spec, app, terraform, shell, container]
    runs-on: ubuntu-24.04-arm  # native arm64, no emulation
    timeout-minutes: 10
    # Lets this job's token push packages. Pull requests get the same
    # permission, but the two publishing steps below are skipped for them.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/andreslopezesquivel/bannin
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two tags for the same image: the commit hash, and main for the latest.
      - name: Build the image
        run: >-
          docker build
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:main" .
      - name: Check the image is arm64
        run: test "$(docker inspect --format '{{.Architecture}}' "$IMAGE:$GITHUB_SHA")" = arm64
      - name: Start the app
        run: docker run --detach --name app --publish 127.0.0.1:8000:8000 "$IMAGE:$GITHUB_SHA"
      # Retries for up to about 30 seconds while the app starts.
      - name: Call /health
        run: curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health
      - name: Check the app doesn't run as root
        run: test "$(docker exec app id -u)" != 0
      - name: Show the app logs
        if: failure()
        run: docker logs app
      - name: Log in to GitHub's container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push both tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"

  # Deploys the image just published to the service's instance, if it
  # runs; otherwise logs that and passes. Pushes to main only; pull
  # requests show it as skipped.
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest  # comes with the AWS CLI and jq
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # lets the job request GitHub's OIDC token for AWS
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trades the job's OIDC token for the bannin-ci role's credentials,
      # valid for an hour. No AWS keys are stored in GitHub.
      # Action: https://github.com/aws-actions/configure-aws-credentials
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # A secret, so the ARN (and its account ID) shows as *** in logs.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          # Also masks the account ID in later output, such as AWS errors.
          mask-aws-account-id: true
      - name: Deploy this commit's image
        run: scripts/deploy.sh "$GITHUB_SHA"
