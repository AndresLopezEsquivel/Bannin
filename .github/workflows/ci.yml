name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow only checks the code.
permissions:
  contents: read

# One run per branch or PR at a time. A new push to a PR cancels its
# older run; runs on main always finish, so every commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned to a full commit SHA, with the tag as a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # the job never pushes, so drop the token
      # Installs uv, which runs the validator below.
      # Action: https://github.com/astral-sh/setup-uv
      # Guide: https://docs.astral.sh/uv/guides/integration/github/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
      - name: Validate the OpenAPI spec
        run: uvx openapi-spec-validator==0.9.0 api/openapi.yaml
      - name: Check the examples against their schemas
        run: uv run --script scripts/check_examples.py

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
      # Installs Python (from .python-version) and the exact versions in
      # uv.lock, dev tools included. Fails if uv.lock is out of date.
      - name: Install dependencies from uv.lock
        run: uv sync --locked
      - name: Lint with ruff
        run: uv run ruff check
      - name: Check formatting with ruff
        run: uv run ruff format --check
      - name: Run the tests with pytest
        run: uv run pytest

  # Checks the Terraform code without AWS credentials: nothing here reads
  # or changes real infrastructure.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Action: https://github.com/hashicorp/setup-terraform
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false  # plain terraform output and exit codes
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      # Downloads the providers in the lock file, without a backend.
      # Fails if the lock file is missing or would need to change.
      - name: Initialize the costs stack
        run: terraform -chdir=infra/costs init -backend=false -input=false -lockfile=readonly
      - name: Validate the costs stack
        run: terraform -chdir=infra/costs validate

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
      # The same pinned ShellCheck as on a developer's machine.
      - name: Lint the shell scripts with ShellCheck
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck scripts/*.sh

  # Builds the image and starts the app and Postgres with compose.yaml,
  # as on a developer's machine. Docker and Compose come with the runner.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A new random password for each run. The value is never printed.
      - name: Write a random Postgres password to .env
        run: printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
      # Returns once both health checks (app's and db's) pass; fails if they don't within 60s.
      - name: Build and start the containers
        run: docker compose up --build --wait --wait-timeout 60
      # Calls /health from the runner (not inside a container), through the published port.
      - name: Call /health
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health
      # Fails if the app runs as root.
      - name: Check the app doesn't run as root
        run: |
          uid=$(docker compose exec -T app id -u)
          echo "app UID: $uid"
          test "$uid" != 0
      - name: Show the container logs
        if: failure()
        run: docker compose logs
      - name: Stop and delete the containers and the volume
        if: always()
        run: docker compose down -v
