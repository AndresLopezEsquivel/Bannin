name: CI

on:
  push:
  pull_request:

# Read-only: this workflow only checks the code.
permissions:
  contents: read

jobs:
  api-spec:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA, with the tag as a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs uv, which runs the validator below.
      # Action: https://github.com/astral-sh/setup-uv
      # Guide: https://docs.astral.sh/uv/guides/integration/github/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
      - name: Validate the OpenAPI spec
        run: uvx openapi-spec-validator==0.9.0 api/openapi.yaml
      - name: Check the examples against their schemas
        run: uv run --script scripts/check_examples.py
