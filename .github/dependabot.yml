# Dependabot opens pull requests that update pinned versions and digests.
# CI runs on each one; nothing merges without review.
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Base images in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Opens a pull request only for releases at least 7 days old.
    cooldown:
      default-days: 7
    # One pull request a week for all minor and patch updates; majors get their own.
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build

  # The Postgres image in compose.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build

  # The SHA-pinned actions in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  # Terraform providers in infra/costs (main.tf and .terraform.lock.hcl).
  - package-ecosystem: terraform
    directory: /infra/costs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build

  # Python packages in pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
