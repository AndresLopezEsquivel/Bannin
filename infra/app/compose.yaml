# Runs the latest Bannin image built from the main branch
# and published to GHCR on the server's EC2 instance.
# cloud-init writes this file to
# /opt/bannin/compose.yaml and starts it on first boot.
name: bannin

services:
  app:
    # The latest Bannin image built from the main branch. Public, so no login needed.
    image: ghcr.io/andreslopezesquivel/bannin:main
    # Starts the container again after a reboot, unless it was stopped
    # by hand.
    restart: unless-stopped
    # Reachable only from the instance itself.
    ports:
      - "127.0.0.1:8000:8000"
    # The image has no curl, so the check uses Python. urlopen raises an
    # error on a refused connection or a 4xx/5xx response, and the exit
    # code is 1.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
