# Runs a Bannin image built from the main branch and published to
# GHCR on the server's EC2 instance.
# cloud-init writes this file to
# /opt/bannin/compose.yaml and starts it on first boot.
name: bannin

services:
  app:
    # A Bannin image built from the main branch. Public, so no login needed.
    # A deploy sets IMAGE_TAG in .env to the commit's hash; until then
    # (at first boot), the tag is main, the latest image.
    image: ghcr.io/andreslopezesquivel/bannin:${IMAGE_TAG:-main}
    # Starts the container again after a reboot, unless it was stopped
    # by hand.
    restart: unless-stopped
    # Reachable only from the instance itself.
    ports:
      - "127.0.0.1:8000:8000"
    # The image has no curl, so the check uses Python. urlopen raises an
    # error on a refused connection or a 4xx/5xx response, and the exit
    # code is 1.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    ports:
      - "443:443"
    # Read from .env next to this file; Compose stops with an error if
    # either is missing.
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?}
      # ACME is the protocol a program like Caddy uses to request a certificate
      # from a certificate authority like Let's Encrypt. ACME_DIR is the URL
      # of the authority's ACME directory: a JSON document that lists the
      # URLs Caddy calls to create an account and request a certificate.
      ACME_DIR: ${ACME_DIR:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Keeps the certificate and the account key across container
      # restarts, so Caddy doesn't request a new certificate each time.
      - caddy_data:/data

volumes:
  caddy_data:
