openapi: 3.1.0

info:
  title: Bannin Scoring API
  version: 0.1.0
  summary: Real-time fraud scoring for card-not-present payments.
  description: >
    The merchant's backend calls Bannin during checkout, before it
    submits the payment for authorization, and gets back a decision.

# Every request must carry an API key as a bearer token. Bannin
# accepts HTTPS only.
security:
  - bearerAuth: []

paths:
  /score:
    post:
      operationId: scorePayment
      summary: Score a payment attempt
      description: >
        Returns a decision (approve, review, or decline) for one payment
        attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreRequest'
      responses:
        '200':
          description: The payment was scored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  schemas:
    ScoreRequest:
      type: object
      description: >
        One payment attempt to score. Fields not listed here are ignored
        and reported in `ignored_fields`, so they don't cause a rejection.
        The same applies to an optional field with an invalid value: the
        payment is scored as if the field had not been sent.
      required: [payment_id, amount, currency, card_id]
      properties:
        payment_id:
          type: string
          description: >
            The merchant's ID for this payment attempt. Unique to one
            attempt: a retry of the same purchase gets a new ID. Sending
            an ID that was already scored returns the original decision.
          minLength: 1
          maxLength: 255
          pattern: '\S'  # at least one non-space character
        amount:
          type: integer
          description: >
            The amount charged, in the currency's smallest unit, such as
            1000 for $10.00.
          minimum: 1
        currency:
          type: string
          description: A three-letter ISO 4217 code in uppercase, such as `USD`.
          pattern: '^[A-Z]{3}$'
        card_id:
          type: string
          description: >
            A stable token for the card, supplied by the merchant. The same
            card always has the same ID. Never the card number.
          minLength: 1
          maxLength: 255
          pattern: '\S'
        # Optional: an invalid value is ignored, not rejected.
        attempted_at:
          type: string
          format: date-time  # RFC 3339 with an offset
          description: >
            When the customer attempted the payment, by the merchant's
            clock, such as `2026-10-30T14:05:00Z`. If omitted, Bannin
            uses the time it received the request.
        order_id:
          type: string
          description: The merchant's ID for the order.
          minLength: 1
          maxLength: 255
        card_bin:
          type: string
          description: The first 6 or 8 digits of the card number.
          pattern: '^([0-9]{6}|[0-9]{8})$'
        card_last4:
          type: string
          description: The last four digits of the card number.
          pattern: '^[0-9]{4}$'
        customer_id:
          type: string
          description: The merchant's ID for the customer's account.
          minLength: 1
          maxLength: 255
        name:
          type: string
          description: The customer's full name.
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          description: The customer's email address.
        phone:
          type: string
          description: The customer's phone number in E.164 format, such as `+14155550100`.
          pattern: '^\+[0-9]{1,15}$'
        ip_address:
          type: string
          description: The customer's IP address, IPv4 or IPv6.
          anyOf:
            - format: ipv4
            - format: ipv6
        device_id:
          type: string
          description: The merchant's ID for the customer's device.
          minLength: 1
          maxLength: 255
        user_agent:
          type: string
          description: >
            The `User-Agent` header from the customer's browser or app,
            copied unchanged by the merchant's server.
          minLength: 1
          maxLength: 1024
        billing_address:
          $ref: '#/components/schemas/Address'
        shipping_address:
          $ref: '#/components/schemas/Address'
    Address:
      type: object
      description: A postal address. Every part is optional.
      properties:
        line1:
          $ref: '#/components/schemas/AddressText'
          description: Street, PO box, or company name.
        line2:
          $ref: '#/components/schemas/AddressText'
          description: Apartment, suite, unit, or building.
        city:
          $ref: '#/components/schemas/AddressText'
          description: City, district, town, or village.
        region:
          $ref: '#/components/schemas/AddressText'
          description: State, county, province, or region, as free text.
        postal_code:
          $ref: '#/components/schemas/AddressText'
          description: ZIP or postal code.
        country:
          type: string
          description: An ISO 3166-1 alpha-2 code in uppercase, such as `US`.
          pattern: '^[A-Z]{2}$'
    AddressText:
      type: string
      minLength: 1
      maxLength: 255
    ScoreResponse:
      type: object
      description: The decision for one payment attempt. Every field is always present.
      required: [payment_id, decision, score, reasons, ignored_fields]
      properties:
        payment_id:
          type: string
          description: The `payment_id` from the request, unchanged.
        decision:
          type: string
          enum: [approve, review, decline]
          description: >
            What the merchant should do. `review` means approve and flag:
            submit the payment as usual, and have a person check it later.
        score:
          type: number
          minimum: 0
          maximum: 100
          description: The fraud risk from 0 to 100, not rounded.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          description: Why the payment got its score. Always empty in this version.
        ignored_fields:
          type: array
          items:
            $ref: '#/components/schemas/IgnoredField'
          description: Request fields that weren't used to score the payment.
    Reason:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: A short, stable code for the reason.
        message:
          type: string
          description: A plain-English explanation.
    IgnoredField:
      type: object
      description: A request field that was ignored. Its value is never included.
      required: [field, code, message]
      properties:
        field:
          type: string
          description: The field's name, as a dot path for nested fields, such as `billing_address.country`.
        code:
          type: string
          enum: [invalid, unrecognized]
        message:
          type: string
          description: What was wrong, such as "must be 6 or 8 digits".
    Error:
      type: object
      description: >
        Every error response has one error. If a request has several
        problems, the API key is reported first, then the fields in the
        order payment_id, amount, currency, card_id.
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              enum: [invalid_request, authentication, idempotency, server_error]
            code:
              type: string
              enum:
                - parameter_missing    # missing, empty, or blank
                - parameter_invalid    # wrong type or format
                - body_invalid         # not a JSON object
                - api_key_missing
                - api_key_invalid
                - payment_id_reused    # same payment_id, different fields
                - internal_error
                - service_unavailable  # can't score right now; retry later
            message:
              type: string
              description: An explanation for the merchant's developers.
            field:
              type: string
              description: The request field that caused the error, if one did.

  responses:
    BadRequest:
      description: The request can't be scored. Fix it and resend.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Send the API key as `Authorization: Bearer <key>`. A missing or
        invalid key gets a 401 response.
