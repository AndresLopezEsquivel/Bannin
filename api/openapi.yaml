openapi: 3.1.0

info:
  title: Bannin Scoring API
  version: 0.1.0
  summary: Real-time fraud scoring for card-not-present payments.
  description: >
    The merchant's backend calls Bannin during checkout, before it
    submits the payment for authorization, and gets back a decision.

# Every request must carry an API key as a bearer token. Bannin
# accepts HTTPS only.
security:
  - bearerAuth: []

paths:
  /score:
    post:
      operationId: scorePayment
      summary: Score a payment attempt
      description: >
        Returns a decision (approve, review, or decline) for one payment
        attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreRequest'
      responses:
        '200':
          description: The payment was scored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResponse'

components:
  schemas:
    ScoreRequest:
      type: object
      description: >
        One payment attempt to score. Fields not listed here are ignored
        and reported in `ignored_fields`, so they don't cause a rejection.
        The same applies to an optional field with an invalid value: the
        payment is scored as if the field had not been sent.
      required: [payment_id, amount, currency, card_id]
      properties:
        payment_id:
          type: string
          description: >
            The merchant's ID for this payment attempt. Unique to one
            attempt: a retry of the same purchase gets a new ID. Sending
            an ID that was already scored returns the original decision.
          minLength: 1
          maxLength: 255
          pattern: '\S'  # at least one non-space character
        amount:
          type: integer
          description: >
            The amount charged, in the currency's smallest unit, such as
            1000 for $10.00.
          minimum: 1
        currency:
          type: string
          description: A three-letter ISO 4217 code in uppercase, such as `USD`.
          pattern: '^[A-Z]{3}$'
        card_id:
          type: string
          description: >
            A stable token for the card, supplied by the merchant. The same
            card always has the same ID. Never the card number.
          minLength: 1
          maxLength: 255
          pattern: '\S'
        # Optional: an invalid value is ignored, not rejected.
        attempted_at:
          type: string
          format: date-time  # RFC 3339 with an offset
          description: >
            When the customer attempted the payment, by the merchant's
            clock, such as `2026-10-30T14:05:00Z`. If omitted, Bannin
            uses the time it received the request.
        order_id:
          type: string
          description: The merchant's ID for the order.
          minLength: 1
          maxLength: 255
        card_bin:
          type: string
          description: The first 6 or 8 digits of the card number.
          pattern: '^([0-9]{6}|[0-9]{8})$'
        card_last4:
          type: string
          description: The last four digits of the card number.
          pattern: '^[0-9]{4}$'
        customer_id:
          type: string
          description: The merchant's ID for the customer's account.
          minLength: 1
          maxLength: 255
        name:
          type: string
          description: The customer's full name.
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          description: The customer's email address.
        phone:
          type: string
          description: The customer's phone number in E.164 format, such as `+14155550100`.
          pattern: '^\+[0-9]{1,15}$'
    # Fields are added in step 6.
    ScoreResponse:
      type: object


  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Send the API key as `Authorization: Bearer <key>`. A missing or
        invalid key gets a 401 response.
